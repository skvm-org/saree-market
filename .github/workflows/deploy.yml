name: Deploy

# Runs after "Backend CI" passes on main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The commit CI tested (workflow_run) or the commit the manual run was started on.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/saree-backend

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Tests already ran in Backend CI for this commit; this only produces the jar for the image.
      - run: ./mvnw -B -DskipTests clean package
        working-directory: backend
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      # The docker CLI on the runner drives the EC2 daemon over SSH: nothing is copied to the server.
      DOCKER_HOST: ssh://${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/saree-backend:${{ github.event.workflow_run.head_sha || github.sha }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # shortcut: trusts the host key seen on first contact, pin it in a secret if the server matters.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      # The registry login is sent with the pull to the remote daemon, so a private repo works.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker compose -f deploy/docker-compose.yml up -d --pull always --remove-orphans
      - run: docker image prune -f
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ secrets.SITE_ADDRESS }}/api/v1/health" && exit 0
            sleep 5
          done
          echo "backend did not become healthy"; docker compose -f deploy/docker-compose.yml logs --tail 50 backend; exit 1
