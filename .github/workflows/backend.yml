name: Backend CI

on:
  pull_request:
    paths: [backend/**, .github/workflows/backend.yml]
  push:
    branches: [main]
    paths: [backend/**, .github/workflows/backend.yml]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Integration tests use Testcontainers; the runner has Docker. `verify` already runs package,
      # so `install` would only copy the jar into the runner's local repo.
      - run: ./mvnw -B clean verify
        working-directory: backend
