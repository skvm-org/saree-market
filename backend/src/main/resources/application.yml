spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    placeholders:
      admin_password_hash: ${ADMIN_PASSWORD_HASH}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry: 24h
  cors:
    # Empty by default: the native Android app needs no CORS. Add the Angular origin here later.
    allowed-origins: []
