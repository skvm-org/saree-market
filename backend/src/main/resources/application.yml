spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 520MB # 50 photos of up to 10 MB, plus form fields; the Android app compresses to well under that first
  flyway:
    placeholders:
      admin_password_hash: ${ADMIN_PASSWORD_HASH}

logging:
  level:
    com.sareemarket: INFO
  pattern:
    # Local runs print the request id after the level; the JSON format used in production carries it as a field.
    level: "%5p [%X{requestId:-}]"

app:
  storage:
    # "local" keeps photos on disk (root below, repo-root data/uploads when run from backend/); "s3" uses the bucket.
    type: local
    root: ../data/uploads
    s3:
      bucket: ""
      prefix: saree-collections/
      # Payment proofs live here, outside prefix, so the photo folder could be opened up without exposing them.
      proofs-prefix: payment-proofs/
      region: us-east-1
      # While true, a photo not found in S3 is read from root, so earlier uploads keep working until they are copied over.
      fallback-to-local: true
  jwt:
    secret: ${JWT_SECRET}
    expiry: 24h
  cors:
    # Empty by default: the native Android app needs no CORS. Add the Angular origin here later.
    allowed-origins: []
