# Production on EC2: backend + Caddy (automatic HTTPS). The database is the shared RDS instance.
# Every ${VAR:?} is a GitHub Actions secret, passed in the environment of `docker compose up`
# (run from the workflow with DOCKER_HOST=ssh://<user>@<ec2>); nothing secret lives in the repo.
services:
  backend:
    image: ${BACKEND_IMAGE:?}   # <dockerhub-user>/saree-backend:<git-sha>, set by the deploy workflow
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL:?}   # jdbc:postgresql://<rds-endpoint>:5432/saree?sslmode=require
      SPRING_DATASOURCE_USERNAME: saree_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?}
      # Shared RDS instance, so keep this app's pool small.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 8
      # Behind Caddy: use X-Forwarded-For as the client address, or the login limiter sees one shared IP.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JWT_SECRET: ${JWT_SECRET:?}   # 32+ characters
      # One JSON object per log line, with the request id and user id as fields, so `docker compose logs | jq` can filter.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      # Printed in the startup line, so the log says which build is running.
      BUILD_SHA: ${BUILD_SHA:-unknown}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?}   # BCrypt; read by the V3 migration on first start
      # Photos and payment proofs live in S3. No keys here: the EC2 instance role grants access (deploy/s3-iam-policy.json).
      # FALLBACK_TO_LOCAL keeps serving earlier uploads from the volume below until they are copied to S3.
      APP_STORAGE_TYPE: s3
      APP_STORAGE_S3_BUCKET: saree-market
      APP_STORAGE_S3_PREFIX: saree-collections/
      APP_STORAGE_S3_PROOFS_PREFIX: payment-proofs/
      APP_STORAGE_S3_REGION: us-east-1
      APP_STORAGE_S3_FALLBACK_TO_LOCAL: "true"
    volumes:
      - uploads:/data/uploads
  caddy:
    image: caddy:2
    restart: unless-stopped
    # Gets and renews the HTTPS certificate for SITE_ADDRESS itself (e.g. 1-2-3-4.sslip.io).
    command: caddy reverse-proxy --from ${SITE_ADDRESS:?} --to backend:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend

volumes:
  uploads:
  caddy_data:
